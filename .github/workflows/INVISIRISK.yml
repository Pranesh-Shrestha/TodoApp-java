name: Java Project x IR

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  packages: read

jobs:
  java-application-build:
    runs-on: ubuntu-latest
    name: Run build
    steps:
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          api_url: "https://app.invisirisk.com"
          app_token: Zxy8VWZyJIZgsgqqQjfc46c2JPxxB25AftKSOti5CPoo11Og4ETBRipevJe-32lZhfmIikVSztEFvLqi6aPK1Q

      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # or '21' depending on your project

      - name: Download direct dependencies only
        run: |
          mvn dependency:go-offline \
          -DexcludeTransitive=true
